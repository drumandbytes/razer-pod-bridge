[env:seeed-xiao-afruitnrf52-nrf52840-sense]
; Not in the PlatformIO registry; pinned to the latest release so fresh clones and CI build the same thing.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.0.0
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
platform_packages =
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
